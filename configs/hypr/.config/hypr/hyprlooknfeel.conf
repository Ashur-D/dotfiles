# ==========================
# Hyprland look and feel
# ==========================

# ================ performance ================

#disable fancy but battery hungry effects
decoration:blur:enabled = false
decoration:shadow:enabled = false
misc:vfr = true #lower the amount of sent frames when nothing is happening on-screen.

source = colors.conf

# ================ general ================
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 0
    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $primary
    col.inactive_border = $on_primary_container
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    layout = dwindle
}

# ================ decoration ================
# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 16
    shadow {
        enabled = false
        range = 2
        render_power = 3
        color = $primary
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 2
        passes = 2
        special = true
        #brightness = 0.60 # this and contrast can make the background darker
        #contrast = 0.75 #
    }
}

# ================ groups ================
# https://wiki.hypr.land/Configuring/Variables/#group
group {
    col.border_active = $primary
    col.border_inactive = $on_primary_container
    col.border_locked_active = -1
    col.border_locked_inactive = -1

    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal

        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0

        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)

        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

# ================ Animations ================
# https://wiki.hyprland.org/Configuring/Variables/#animations
$ANIMATION_PATH=$HOME/.config/hypr/hyprAnimations
source = $ANIMATION_PATH/theme.conf

# ================ dwindle ================
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2 # Always split on the right
}

# ================ master ================
# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}


# ================ misc ================
# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    focus_on_activate = true
    anr_missed_pings = 3
    on_focus_under_fullscreen = 1
}

# https://wiki.hypr.land/Configuring/Variables/#cursor
cursor {
    hide_on_key_press = true
    warp_on_change_workspace = 1
}

# Auto toggle scratchpad on switching workspace from scratchpad
binds {
    hide_special_on_workspace_change = true
}
