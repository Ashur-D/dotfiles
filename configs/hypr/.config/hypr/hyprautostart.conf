# ==========================
# Hyprland autostart
# ==========================

exec-once = bash -c 'swww-daemon & sleep 2 && if [ ! -d ~/.cache/swww ] || [ -z "$(ls -A ~/.cache/swww)" ]; then ~/.config/scripts/wallpaper.sh ~/.config/wallpapers/wallpaper13.png; fi'

# Session environment for systemd/dbus/portals
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

# gtk
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark''

# Waybar
exec-once = waybar

# Authentication agent
exec-once = systemctl --user start hyprpolkitagent

# Notifications
exec-once = mako

# Idle/lock handling
exec-once = hypridle

# OSD
exec-once = swayosd-server

# Wallpaper and theme
exec-once = awww-daemon

# clipse tui clipboard
exec-once = clipse -listen

# cursor
# exec-once = hyprctl setcursor catppuccin-mocha-dark-cursors 24
