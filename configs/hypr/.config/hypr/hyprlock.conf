# BACKGROUND
source = colors.conf
background {
    monitor =
    path = /home/ash/.config/wallpapers/wallpaper84.jpg
    blur_passes = 3
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 290, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(60, 56, 54, 0.35)
    font_color = $secondary
    fade_on_empty = false
    font_family = MapleMono Bold Italic
    placeholder_text = <i>bello!</i>
    hide_input = false
    position = 0,-200
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $secondary
  font_size = 32
  font_family = MapleMono Bold Italic
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = $secondary
  font_size = 132
  font_family = MapleMono Bold Italic
  position = 0, 180
  halign = center
  valign = center
}
