# ==========================
# Hyprland autostart
# ==========================

exec-once = hypridle
exec-once = mako
exec-once = waybar
exec-once = systemctl --user start hyprpolkitagent
exec-once = swayosd-server
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = wl-clip-persist --clipboard regular
exec-once = awww-daemon
exec-once = sleep 1 && awww restore && matugen image -m dark --source-color-index 0 $(awww query | awk '{print $NF}') && waybar & mako
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark' && gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
