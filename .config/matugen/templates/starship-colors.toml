add_newline = true
command_timeout = 200

# The layout: Just Directory, Branch, Status, and the prompt character
format = "$directory$git_branch$git_status$character"

# 1. Define the dynamic Matugen palette here
palette = "matugen"

[palettes.matugen]
primary = "{{colors.primary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"

# 2. Minimal modules
[directory]
format = "[$path]($style) "
style = "bold primary"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "bold secondary"
symbol = "" # Removes the git icon to match the screenshot exactly

[git_status]
format = "[$all_status]($style) "
style = "bold tertiary"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "!"
up_to_date = ""
untracked = "?"
modified = "*"
stashed = ""
staged = "+"
renamed = "»"
deleted = "✘"

[character]
# Matches the minimal chevron seen in the screenshot
success_symbol = "[>](bold primary)"
error_symbol = "[>](bold error)"
vimcmd_symbol = "[<](bold secondary)"
