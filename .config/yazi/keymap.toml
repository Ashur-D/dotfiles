# Call the dynamic Matugen palette
palette = 'matugen'

[palettes.matugen]
color_surface0 = "{{colors.surface_container_high.default.hex}}"
color_text = "{{colors.on_surface.default.hex}}"
color_peach = "{{colors.primary.default.hex}}"
color_mantle = "{{colors.on_primary.default.hex}}"
color_green = "{{colors.secondary.default.hex}}"
color_base = "{{colors.on_secondary.default.hex}}"
color_teal = "{{colors.tertiary.default.hex}}"
color_blue = "{{colors.primary_fixed_dim.default.hex}}"
color_purple = "{{colors.secondary_fixed_dim.default.hex}}"
color_red = "{{colors.error.default.hex}}"
color_lavender = "{{colors.tertiary_fixed.default.hex}}"


"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_purple)\
$os\
$username\
[](bg:color_red fg:color_purple)\
$directory\
[](fg:color_red bg:color_peach)\
$git_branch\
$git_status\
[](fg:color_peach bg:color_blue)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:color_blue bg:color_teal)\
$docker_context\
[](fg:color_teal bg:color_green)\
$time\
[ ](fg:color_green)\
\n$character"""



# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:color_purple fg:color_text"
style_root = "bg:color_purple fg:color_text"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:color_purple fg:color_text"
disabled = true # Disabled by default

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
Mint = "󰣭"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Arch = "󰣇"
Debian = "󰣚"


[directory]
style = "bg:color_red fg:color_text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:color_teal fg:color_base"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:color_peach fg:color_mantle"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:color_peach fg:color_mantle"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:color_blue fg:color_base"
format = '[ $symbol ($version) ]($style)'

